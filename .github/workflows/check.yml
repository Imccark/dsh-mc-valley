name: Check

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check generated client
        run: uv run --no-project --python 3.11 python -B scripts/build_plugin.py --check
      - name: Check selector compatibility
        run: uv run --no-project --python 3.11 python -B scripts/test_dsh_wsl_compat.py
      - name: Check plugin lifecycle
        run: node scripts/test_skin_lifecycle.mjs
      - name: Check package contents
        run: npm pack --dry-run --ignore-scripts
